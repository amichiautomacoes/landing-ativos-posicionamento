    <section class="hero hero--video" aria-labelledby="hero-title" lang="pt-BR">
      <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="{{ static_url('images/hero/desktop-poster.jpg') }}" data-desktop-poster="{{ static_url('images/hero/desktop-poster.jpg') }}" data-mobile-poster="{{ static_url('images/hero/mobile-poster.jpg') }}" aria-hidden="true" tabindex="-1">
        <source src="{{ static_url('videos/hero/mobile.mp4') }}" type="video/mp4" media="(max-width: 1020px)">
        <source src="{{ static_url('videos/hero/desktop.mp4') }}" type="video/mp4">
      </video>
      <div class="hero-content">
        <div class="hero-copy">
          <h1 id="hero-title">Sua empresa, do Google ao WhatsApp.</h1>
          <p class="hero-subtitle"><strong>Conectamos sua presença no Google, seus anúncios e o atendimento para atrair novos contatos e acompanhar cada oportunidade.</strong></p>
          <div class="hero-actions">
            {{ contact_button('button hero-whatsapp') }}
            <a class="text-link" href="#capabilities">Veja como funciona <span aria-hidden="true">↓</span></a>
          </div>
        </div>
      </div>
      <button class="hero-video-toggle" type="button" hidden>
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6 4v12M14 4v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        <span>Pausar vídeo</span>
      </button>
    </section>
